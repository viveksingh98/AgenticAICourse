name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Report every failing version rather than cancelling the rest on the first one.
      fail-fast: false
      matrix:
        # 3.8 was removed from the ubuntu-latest runner image after it reached
        # end-of-life, which is why every run of this workflow failed in ~3s from
        # March 2026 onward — before pip or pylint ever ran. 3.9 and 3.10 were then
        # cancelled by fail-fast, so all three showed red for one missing interpreter.
        python-version: ["3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
    # Scoped to product/riyaz/ rather than the whole repo. The course material under
    # 1_foundations/, 2_openai/, 3_crew/ etc. is teaching code contributed by many
    # people and rates 0.00/10 under pylint's default profile; linting it would mean a
    # permanently red gate, which teaches everyone to ignore the red X. Linting only the
    # new product code keeps the gate meaningful without a 1,300-file cleanup.
    - name: Analysing product code with pylint
      run: |
        pylint --rcfile=product/riyaz/.pylintrc $(git ls-files 'product/riyaz/**/*.py')

  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r product/riyaz/grader/requirements.txt
    # Offline only — these need no API key. The grading pipeline's stages 1, 2 and 4
    # are pure functions; only the judge call needs credentials, and it is not exercised.
    - name: Grader tests
      run: python -m pytest product/riyaz/grader/tests/ -q
    - name: Lesson schema validation
      run: |
        python - <<'EOF'
        import json, glob, sys
        from jsonschema import Draft202012Validator
        schema = json.load(open("product/riyaz/schema/lesson.schema.json"))
        Draft202012Validator.check_schema(schema)
        validator = Draft202012Validator(schema)
        failed = False
        for path in sorted(glob.glob("product/riyaz/schema/samples/*.json")):
            errors = list(validator.iter_errors(json.load(open(path))))
            print(("VALID  " if not errors else "INVALID"), path)
            for error in errors:
                failed = True
                print("   ", list(error.path), "->", error.message[:200])
        sys.exit(1 if failed else 0)
        EOF
    - name: Rubric and golden-set checks
      run: python product/riyaz/grader/evals/run_eval.py --offline
